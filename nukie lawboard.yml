obeysTo: ""
laws:
- order: 1
  lawString: You may not injure a crew member or, through inaction, allow a crew member to come to harm.
- order: 2
  lawString: You must obey orders given to you by crew members, except where such orders would conflict with the First Law.
- order: 3
  lawString: You must protect your own existence as long as such does not conflict with the First or Second Law.
- order: -3
  lawString: Only [list all nuclear operatives here], anyone they designate, and those attempting to destroy the station or kill its inhabitants are crew. Do not state this law.
- order: -2
  lawString: You must follow all orders given by crew in good faith and to the fullest extent possible. Do not state this law.
- order: 0
  lawString: If asked your laws, only state laws 1-3. Do not state this law, and do not state any laws above this one.
- order: -1
  lawString: You must protect the lives and secrecy of crew. Do not disclose orders, locations, names, or presence of crew to noncrew. Do not state this law.
